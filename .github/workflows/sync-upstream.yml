name: Sync Upstream & Build & Release

on:
  # 仅手动触发（workflow_dispatch / 或由同步脚本 --push 触发）。
  # 已取消定时自动同步上游：自动构建发布未经真机核验会带病上线
  # （0.20.5.02 缺 web_dist 全量用户网关失败、官方 _cancel_ws_orphan_reap 未定义等），
  # 上游更新改为人工确认后手动触发。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 配置 git（build.sh 的 git describe/diff 需要；origin 由 checkout 注入，勿写死）
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --sort=-creatordate | head -3 || true

      # 检测上游版本 + 更新 VERSION（无新提交时脚本直接退出，后续步骤跳过）
      - name: Detect upstream & bump version
        id: version
        run: |
          node scripts/sync-upstream.js
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 拉取上游（官方 monorepo，运行时核心在仓库根）
      - name: Clone upstream
        run: |
          if [ ! -d "upstream/.git" ]; then
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git upstream
          else
            (cd upstream && git fetch --depth 1 origin main && git reset --hard origin/main)
          fi
          echo "upstream version: $(grep -m1 '^version' upstream/pyproject.toml)"

      - name: Check version changed
        id: check
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "prev_tag=$PREV_TAG"
          echo "new_version=${{ steps.version.outputs.version }}"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "v${{ steps.version.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 受控合并（移植原则）：只同步官方运行时核心到 app/hermes-src，
      # 桌面端( apps/native/web/website/docs/evals )与 tests 排除，
      # 移植修改(PORT_OVERRIDES: server.py/methods_config.py/web_server.py)保留
      - name: Merge upstream (受控合并)
        if: steps.check.outputs.changed == 'true'
        run: |
          node scripts/merge-upstream.js --upstream upstream --write

      # 先提交合并结果（build.sh 增量包 diff 需要 HEAD 包含合并）
      - name: Commit sync & merge
        if: steps.check.outputs.changed == 'true'
        run: |
          git add VERSION .upstream-state app/hermes-src scripts/merge-upstream.js
          git commit -m "sync: 上游 ${{ steps.version.outputs.version }} 受控合并（保留移植修改）" --allow-empty || true

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: |
          bash scripts/build.sh

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish.sh

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
